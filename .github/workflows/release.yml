# Push a tag (vX.Y.Z) to publish a release. Asset names are fixed, so these
# URLs always fetch the newest release:
#   https://github.com/Real-Fruit-Snacks/killer-skills/releases/latest/download/<skill>.zip
#   https://github.com/Real-Fruit-Snacks/killer-skills/releases/latest/download/killer-skills.zip
#   https://github.com/Real-Fruit-Snacks/killer-skills/releases/latest/download/killer-skills-fonts.zip
#   https://github.com/Real-Fruit-Snacks/killer-skills/releases/latest/download/killer-skills-runtime-windows-x64.zip
#   https://github.com/Real-Fruit-Snacks/killer-skills/releases/latest/download/install.ps1
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  packs:
    uses: ./.github/workflows/packs.yml

  release:
    needs: packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check the version is in CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^## ${v} " CHANGELOG.md || { echo "CHANGELOG.md has no '## ${v} ' section"; exit 1; }
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          cat notes.md

      - name: Test
        run: |
          python -I tests/test_council.py
          python -I tests/test_package.py
          python -I tests/test_fonts.py
          python -I tests/test_install.py

      - name: Pack
        run: python -I tools/package.py --out dist

      - uses: actions/download-artifact@v8
        with:
          pattern: packs-*
          path: dist
          merge-multiple: true

      - name: Checksums over everything, the packs and the installers included
        run: |
          cp install.sh install.ps1 dist/
          cd dist
          for f in killer-skills-fonts.zip killer-skills-fonts.tar.gz killer-skills-runtime-windows-x64.zip \
                   killer-skills-node-windows-x64.zip killer-skills-python-windows-x64.zip; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
          done
          sha256sum -- *.zip *.tar.gz install.sh install.ps1 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag dist/*
